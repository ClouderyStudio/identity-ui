<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="云术身份中心 —— 一处登录，全站通行。统一账号、第三方登录与账户管理。" />
    <meta name="robots" content="noindex" />
    <title>云术身份中心</title>
    <script>
      // 首屏绘制前先把配色定下来，避免深色主题闪一下白（与 official-site 同一约定）
      ;(function () {
        try {
          var stored = localStorage.getItem('cloudery-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* 首屏退回浅色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
